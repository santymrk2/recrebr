<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>B&R — Balloon Type v2</title>
    <style>
      :root {
        --bg: #f2ede3;
        --orange: #e86f3d;
        --ink: #173d3d;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }
      canvas.dragging {
        cursor: grabbing;
      }
      .background-type {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
        color: var(--orange);
        opacity: 0.9;
        font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
        font-weight: 900;
        line-height: 0.78;
        letter-spacing: -0.045em;
        transform: rotate(-7deg) scale(1.1);
        user-select: none;
      }
      .background-type div {
        position: absolute;
        white-space: nowrap;
        font-size: clamp(90px, 13vw, 220px);
      }
      .background-type .a {
        top: 5%;
        left: -7%;
      }
      .background-type .b {
        top: 25%;
        left: -16%;
      }
      .background-type .c {
        top: 45%;
        left: -3%;
      }
      .background-type .d {
        top: 65%;
        left: -18%;
      }
      .background-type .e {
        top: 84%;
        left: -5%;
      }
      #scene {
        position: fixed;
        inset: 0;
        z-index: 1;
      }
      .hud {
        position: fixed;
        z-index: 5;
        left: 24px;
        bottom: 22px;
        padding: 10px 14px;
        border: 1px solid rgba(23, 61, 61, 0.12);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.46);
        backdrop-filter: blur(12px);
        color: var(--ink);
        font-size: 12px;
        letter-spacing: 0.02em;
        pointer-events: none;
      }
      .loading {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font-size: 14px;
        transition: opacity 0.35s ease;
      }
      .loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .error {
        position: fixed;
        z-index: 30;
        left: 50%;
        top: 50%;
        width: min(680px, calc(100vw - 40px));
        transform: translate(-50%, -50%);
        padding: 22px;
        border-radius: 18px;
        background: #fff;
        color: #7d251c;
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.15);
        font:
          13px/1.55 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        display: none;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="background-type" aria-hidden="true">
      <div class="a">RECREACIÓN</div>
      <div class="b">RECREACIÓN</div>
      <div class="c">RECREACIÓN</div>
      <div class="d">RECREACIÓN</div>
      <div class="e">RECREACIÓN</div>
    </div>
    <div id="scene"></div>
    <div class="hud">
      Arrastrá B, &amp; o R · gravedad 0 · soltá para que floten
    </div>
    <div id="loading" class="loading">Inflando B&amp;R…</div>
    <div id="error" class="error"></div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { FontLoader } from "three/addons/loaders/FontLoader.js";
      import { TextGeometry } from "three/addons/geometries/TextGeometry.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

      import { mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";

      import * as RAPIER from "https://esm.sh/@dimforge/rapier3d-compat@0.12.0";

      const FONT_URL =
        "https://cdn.jsdelivr.net/gh/mrdoob/three.js@r186/examples/fonts/droid/droid_sans_bold.typeface.json";
      const BALLOON_COLOR = 0x2dc9c8;
      const sceneRoot = document.querySelector("#scene"),
        loading = document.querySelector("#loading"),
        errorBox = document.querySelector("#error");
      let scene,
        camera,
        renderer,
        world,
        letters = [],
        dragged = null;
      const raycaster = new THREE.Raycaster(),
        pointer = new THREE.Vector2(),
        dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0),
        dragPoint = new THREE.Vector3(),
        dragOffset = new THREE.Vector3(),
        timer = new THREE.Timer();

      function showError(error) {
        console.error(error);
        errorBox.textContent =
          "No se pudo iniciar la demo.\n\n" +
          (error?.stack || error?.message || String(error));
        errorBox.style.display = "block";
        loading.classList.add("hidden");
      }

      async function boot() {
        try {
          await RAPIER.init();
          scene = new THREE.Scene();
          scene.background = new THREE.Color(0xf2ede3);
          camera = new THREE.PerspectiveCamera(
            34,
            innerWidth / innerHeight,
            0.1,
            100,
          );
          camera.position.set(0, 0.15, 9.2);
          camera.lookAt(0, 0, 0);
          renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: false,
            powerPreference: "high-performance",
          });
          renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
          renderer.setSize(innerWidth, innerHeight);
          renderer.outputColorSpace = THREE.SRGBColorSpace;
          renderer.toneMapping = THREE.ACESFilmicToneMapping;
          renderer.toneMappingExposure = 0.8;
          sceneRoot.appendChild(renderer.domElement);
          const pmrem = new THREE.PMREMGenerator(renderer),
            environment = new RoomEnvironment();
          scene.environment = pmrem.fromScene(environment, 0.04).texture;
          environment.dispose();
          pmrem.dispose();
          const key = new THREE.DirectionalLight(0xffffff, 2.6);
          key.position.set(-3, 5, 6);
          scene.add(key);
          const fill = new THREE.DirectionalLight(0xbefafa, 1.4);
          fill.position.set(5, 1, 3);
          scene.add(fill);
          const rim = new THREE.PointLight(0xffffff, 24, 16, 2);
          rim.position.set(0, 3.5, 4.5);
          scene.add(rim);
          world = new RAPIER.World({ x: 0, y: 0, z: 0 });

          world = new RAPIER.World({ x: 0, y: 0, z: 0 });

          // AGREGAR ESTA LÍNEA ACÁ:
          setupBoundaryWalls();

          const font = await new FontLoader().loadAsync(FONT_URL);
          const specs = [
            { text: "B", x: -1.2, y: 0.05, z: 0, rot: -0.06, scale: 0.6 },
            { text: "&", x: 0, y: -0.02, z: 0.03, rot: 0.04, scale: 0.5 },
            { text: "R", x: 1.2, y: 0.02, z: 0, rot: 0.07, scale: 0.6 },
          ];
          for (const spec of specs) createLetter(font, spec);
          setupPointerEvents();
          addEventListener("resize", onResize);
          loading.classList.add("hidden");
          animate();
        } catch (error) {
          showError(error);
        }
      }

      function createMaterial() {
        return new THREE.MeshPhysicalMaterial({
          color: 0x22c5c4, // El color exacto
          roughness: 0.35, // Más rugosidad para retener el pigmento base
          metalness: 0.05,
          clearcoat: 0.3, // Menos brillo plástico superior
          clearcoatRoughness: 0.2,
          envMapIntensity: 0.5, // Clave: evita que el entorno blanco "lave" el color
          transmission: 0.05,
        });
      }

      function createLetter(font, spec) {
        let geometry = new TextGeometry(spec.text, {
          font,
          size: 2.0,
          depth: 0.4,
          curveSegments: 12, // Lo subimos de 8 a 12 (curvas mucho más limpias)
          bevelEnabled: true,
          bevelThickness: 0.35,
          bevelSize: 0.2,
          bevelOffset: 0,
          bevelSegments: 8, // Lo subimos de 6 a 8 (elimina los "escalones" del redondeado)
        });
        geometry.computeBoundingBox();
        const center = new THREE.Vector3();
        geometry.boundingBox.getCenter(center);
        geometry.translate(-center.x, -center.y, -center.z);

        geometry.computeBoundingSphere();
        geometry.computeVertexNormals();

        const mesh = new THREE.Mesh(geometry, createMaterial());
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.position.set(spec.x, spec.y, spec.z);
        mesh.rotation.z = spec.rot;
        mesh.scale.setScalar(spec.scale);
        mesh.userData.baseScale = spec.scale;
        mesh.userData.text = spec.text;
        scene.add(mesh);
        const size = new THREE.Vector3();
        geometry.boundingBox.getSize(size);
        const half = {
          x: Math.max(size.x * spec.scale * 0.47, 0.25),
          y: Math.max(size.y * spec.scale * 0.47, 0.25),
          z: Math.max(size.z * spec.scale * 0.5, 0.2),
        };
        const bodyDesc = RAPIER.RigidBodyDesc.dynamic()
          .setTranslation(spec.x, spec.y, spec.z)
          .setGravityScale(0)
          .setLinearDamping(3.0) // Reducido de 4.5 para que deslice más suave al soltar
          .setAngularDamping(3.5) // Reducido de 5 para una rotación más natural
          .setCanSleep(true);
        const body = world.createRigidBody(bodyDesc);
        const colliderDesc = RAPIER.ColliderDesc.cuboid(half.x, half.y, half.z)
          .setDensity(0.65)
          .setFriction(0.45)
          .setRestitution(0.38);
        world.createCollider(colliderDesc, body);
        const item = {
          mesh,
          body,
          half,
          target: new THREE.Vector3(spec.x, spec.y, spec.z),
          dragVelocity: new THREE.Vector3(),
          previousDragPoint: new THREE.Vector3(),
          isDragging: false,
        };
        mesh.userData.letter = item;
        letters.push(item);
      }

      function setupPointerEvents() {
        const canvas = renderer.domElement;
        canvas.addEventListener("pointerdown", onPointerDown);
        canvas.addEventListener("pointermove", onPointerMove);
        canvas.addEventListener("pointerup", onPointerUp);
        canvas.addEventListener("pointercancel", onPointerUp);
        canvas.addEventListener("pointerleave", onPointerUp);
        canvas.addEventListener("dblclick", onDoubleClick);
      }
      function updatePointer(event) {
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      }

      function onDoubleClick(event) {
        updatePointer(event);
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(
          letters.map((item) => item.mesh),
          false,
        );
        if (!hits.length) return;
        const item = hits[0].object.userData.letter;
        if (!item) return;

        // Reseteamos la rotación del cuerpo físico para que mire completamente de frente (quaternion neutro)
        item.body.setRotation({ x: 0, y: 0, z: 0, w: 1 }, true);

        // Frenamos cualquier giro o velocidad de rotación que tuviera
        item.body.setAngvel({ x: 0, y: 0, z: 0 }, true);
      }

      function onPointerDown(event) {
        updatePointer(event);
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(
          letters.map((item) => item.mesh),
          false,
        );
        if (!hits.length) return;
        const item = hits[0].object.userData.letter;
        if (!item) return;

        dragged = item;
        dragged.isDragging = true;

        dragPlane.constant = -item.mesh.position.z;
        if (raycaster.ray.intersectPlane(dragPlane, dragPoint)) {
          dragOffset.copy(item.mesh.position).sub(dragPoint);
          item.previousDragPoint.copy(dragPoint);
          item.target.copy(item.mesh.position);
        }

        // Dejamos el cuerpo dinámico pero sin velocidad ni gravedad para controlarlo por fuerza
        item.body.setLinvel({ x: 0, y: 0, z: 0 }, true);
        item.body.setAngvel({ x: 0, y: 0, z: 0 }, true);
        item.dragVelocity.set(0, 0, 0);

        renderer.domElement.classList.add("dragging");
        renderer.domElement.setPointerCapture?.(event.pointerId);
      }

      function onPointerMove(event) {
        if (!dragged) return;
        updatePointer(event);
        raycaster.setFromCamera(pointer, camera);
        if (!raycaster.ray.intersectPlane(dragPlane, dragPoint)) return;

        const next = dragPoint.clone().add(dragOffset);
        next.z = 0;

        // Calculamos la delta de movimiento para la inercia al soltar
        const delta = next.clone().sub(dragged.previousDragPoint);
        dragged.dragVelocity.lerp(delta.multiplyScalar(50), 0.4);
        dragged.previousDragPoint.copy(next);

        // Movemos el cuerpo físico usando velocidad hacia el objetivo (respeta colisiones)
        const currentPos = dragged.body.translation();
        const vx = (next.x - currentPos.x) * 20;
        const vy = (next.y - currentPos.y) * 20;

        dragged.body.setLinvel({ x: vx, y: vy, z: 0 }, true);
        dragged.body.setAngvel({ x: 0, y: 0, z: 0 }, true);
      }
      function onPointerUp(event) {
        if (!dragged) return;
        dragged.isDragging = false;
        dragged.body.setLinvel(
          {
            x: THREE.MathUtils.clamp(dragged.dragVelocity.x, -4.5, 4.5),
            y: THREE.MathUtils.clamp(dragged.dragVelocity.y, -4.5, 4.5),
            z: 0,
          },
          true,
        );
        dragged = null;
        renderer.domElement.releasePointerCapture?.(event.pointerId);
        renderer.domElement.classList.remove("dragging");
      }

      function syncPhysics() {
        world.step();
        for (const item of letters) {
          // Si lo estamos arrastrando, mantenemos z anclado en 0 para que no se vaya al fondo
          if (item.isDragging) {
            const pos = item.body.translation();
            item.body.setTranslation({ x: pos.x, y: pos.y, z: 0 }, true);
          }

          const t = item.body.translation(),
            r = item.body.rotation();
          item.mesh.position.set(t.x, t.y, t.z);
          item.mesh.quaternion.set(r.x, r.y, r.z, r.w);
        }
      }
      function setupBoundaryWalls() {
        // Calculamos el ancho y alto visible del plano a la distancia z = 0 de los globos
        const distance = camera.position.z;
        const vFov = (camera.fov * Math.PI) / 180;
        const height = 2 * Math.tan(vFov / 2) * distance;
        const width = height * camera.aspect;

        // Margen de seguridad para que reboten antes de tocar el borde exacto
        const hw = width * 0.44;
        const hh = height * 0.44;
        const thickness = 1.0;

        // Definimos las 4 paredes (Izquierda, Derecha, Arriba, Abajo)
        const walls = [
          { x: -hw - thickness / 2, y: 0, hx: thickness / 2, hy: hh }, // Izquierda
          { x: hw + thickness / 2, y: 0, hx: thickness / 2, hy: hh }, // Derecha
          { x: 0, y: hh + thickness / 2, hx: hw, hy: thickness / 2 }, // Arriba
          { x: 0, y: -hh - thickness / 2, hx: hw, hy: thickness / 2 }, // Abajo
        ];

        for (const w of walls) {
          const wallDesc = RAPIER.RigidBodyDesc.fixed().setTranslation(
            w.x,
            w.y,
            0,
          );
          const wallBody = world.createRigidBody(wallDesc);
          const colliderDesc = RAPIER.ColliderDesc.cuboid(w.hx, w.hy, 2.0)
            .setRestitution(0.6) // Rebote (0 = no rebota, 1 = rebote total)
            .setFriction(0.2); // Fricción baja para que deslicen bien al tocar el borde
          world.createCollider(colliderDesc, wallBody);
        }
      }
      function animate() {
        requestAnimationFrame(animate);
        timer.update();
        const elapsed = timer.getElapsed();
        syncPhysics();
        for (const item of letters) {
          const breathing =
              1 +
              Math.sin(elapsed * 1.15 + item.mesh.userData.text.charCodeAt(0)) *
                0.012,
            s = item.mesh.userData.baseScale * breathing;
          item.mesh.scale.setScalar(s);
        }
        renderer.render(scene, camera);
      }
      function onResize() {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
      }
      boot();
    </script>
  </body>
</html>
