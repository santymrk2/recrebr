<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>B&R — Balloon Type</title>

    <style>
      :root {
        --bg: #f2ede3;
        --orange: #e86f3d;
        --ink: #d55b00;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;

        background: var(--bg);

        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        position: relative;
      }

      /*
       * ==================================================
       * BACKGROUND TYPOGRAPHY
       * ==================================================
       */
      .background-type {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
        user-select: none;

        color: var(--orange);

        font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;

        font-size: clamp(110px, 15vw, 240px);
        font-weight: 900;
        line-height: 0.82;
        letter-spacing: -0.055em;

        display: flex;
        align-items: center;

        transform: rotate(-7deg) scale(1.12);
      }
      .background-marquee {
        display: flex;
        width: max-content;
        flex-shrink: 0;

        animation: marquee 90s linear infinite;
        will-change: transform;
      }

      .background-track {
        display: flex;
        align-items: center;
        flex-shrink: 0;

        white-space: nowrap;

        gap: 0.42em;
        padding-right: 0.42em;
      }

      .background-track span {
        display: block;
        flex-shrink: 0;
      }

      /*
 * La segunda tira es exactamente igual a la primera.
 * Cuando la primera sale, la segunda ocupa su lugar,
 * creando un loop continuo.
 */
      @keyframes marquee {
        from {
          transform: translateX(0);
        }

        to {
          transform: translateX(-50%);
        }
      }
      /*
       * ==================================================
       * THREE.JS
       * ==================================================
       */

      #scene {
        position: fixed;

        inset: 0;

        z-index: 1;
      }

      canvas {
        display: block;

        width: 100%;
        height: 100%;

        touch-action: none;

        cursor: grab;
      }

      canvas.dragging {
        cursor: grabbing;
      }

      /*
       * ==================================================
       * HUD
       * ==================================================
       */

      .hud {
        position: fixed;

        left: 24px;
        bottom: 22px;

        z-index: 5;

        display: flex;

        align-items: center;

        gap: 10px;

        padding: 6px 6px 6px 14px;

        border: 1px solid rgba(23, 61, 61, 0.12);

        border-radius: 999px;

        background: rgba(255, 255, 255, 0.46);

        backdrop-filter: blur(12px);

        color: var(--ink);

        font-size: 12px;

        letter-spacing: 0.02em;
      }

      .hud button {
        border: 0;

        border-radius: 999px;

        padding: 7px 12px;

        background: var(--ink);

        color: white;

        font: inherit;

        font-weight: 600;

        cursor: pointer;

        transition:
          transform 0.15s ease,
          opacity 0.15s ease;
      }

      .hud button:hover {
        opacity: 0.85;

        transform: translateY(-1px);
      }

      .hud button:active {
        transform: translateY(0);
      }

      /*
       * ==================================================
       * LOADING
       * ==================================================
       */

      .loading {
        position: fixed;

        inset: 0;

        z-index: 20;

        display: grid;

        place-items: center;

        background: var(--bg);

        color: var(--ink);

        font-size: 14px;

        font-weight: 500;

        transition:
          opacity 0.35s ease,
          visibility 0.35s ease;
      }

      .loading.hidden {
        opacity: 0;

        visibility: hidden;

        pointer-events: none;
      }

      /*
       * ==================================================
       * ERROR
       * ==================================================
       */

      .error {
        position: fixed;

        z-index: 30;

        left: 50%;
        top: 50%;

        width: min(680px, calc(100vw - 40px));

        transform: translate(-50%, -50%);

        padding: 22px;

        border-radius: 18px;

        background: white;

        color: #7d251c;

        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.15);

        font:
          13px/1.55 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;

        display: none;

        white-space: pre-wrap;
      }
    </style>
  </head>

  <body>
    <!-- ==================================================
         BACKGROUND
         ================================================== -->

    <div class="background-type" aria-hidden="true">
      <div class="background-marquee">
        <div class="background-track">
          <span>RECREACIÓN</span>
          <span>RECREACIÓN</span>
          <span>RECREACIÓN</span>
          <span>RECREACIÓN</span>
          <span>RECREACIÓN</span>
          <span>RECREACIÓN</span>
          <span>RECREACIÓN</span>
          <span>RECREACIÓN</span>
        </div>

        <div class="background-track" aria-hidden="true">
          <span>RECREACIÓN</span>
          <span>RECREACIÓN</span>
          <span>RECREACIÓN</span>
          <span>RECREACIÓN</span>
          <span>RECREACIÓN</span>
          <span>RECREACIÓN</span>
          <span>RECREACIÓN</span>
          <span>RECREACIÓN</span>
        </div>
      </div>
    </div>
    <div id="scene"></div>

    <!-- ==================================================
         HUD
         ================================================== -->

    <div class="hud">
      <span> Arrastrá B, &amp; o R · gravedad 0 · soltá para volver </span>

      <button id="resetButton" type="button">Restaurar</button>
    </div>

    <!-- ==================================================
         LOADING
         ================================================== -->

    <div id="loading" class="loading">Inflando B&amp;R…</div>

    <!-- ==================================================
         ERROR
         ================================================== -->

    <div id="error" class="error"></div>

    <!-- ==================================================
         IMPORT MAP
         ================================================== -->

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";

      import { FontLoader } from "three/addons/loaders/FontLoader.js";

      import { TextGeometry } from "three/addons/geometries/TextGeometry.js";

      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

      import { mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";

      /*
       * ==================================================
       * RAPier
       * ==================================================
       */

      import * as RAPIER from "https://esm.sh/@dimforge/rapier3d-compat@0.12.0";

      /*
       * ==================================================
       * CONFIG
       * ==================================================
       */

      const FONT_URL = "./fonts/Arial Rounded MT.json";

      /*
       * Este es el color base real.
       *
       * El material y la iluminación están configurados
       * para que no termine lavado.
       */

      const BALLOON_COLOR = 0x00c8cf;

      /*
       * ==================================================
       * DOM
       * ==================================================
       */

      const sceneRoot = document.querySelector("#scene");

      const loading = document.querySelector("#loading");

      const errorBox = document.querySelector("#error");

      /*
       * ==================================================
       * THREE
       * ==================================================
       */

      let scene;
      let camera;
      let renderer;

      /*
       * ==================================================
       * PHYSICS
       * ==================================================
       */

      let world;

      /*
       * ==================================================
       * LETTERS
       * ==================================================
       */

      const letters = [];

      let dragged = null;

      /*
       * ==================================================
       * POINTER
       * ==================================================
       */

      const raycaster = new THREE.Raycaster();

      const pointer = new THREE.Vector2();

      const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

      const dragPoint = new THREE.Vector3();

      const dragOffset = new THREE.Vector3();

      /*
       * ==================================================
       * TIMER
       * ==================================================
       */

      const timer = new THREE.Timer();

      /*
       * ==================================================
       * WALLS
       * ==================================================
       */

      const wallBodies = {};

      /*
       * ==================================================
       * MATERIAL
       * ==================================================
       *
       * Más saturación:
       *
       * - sin metal
       * - roughness muy baja
       * - clearcoat alto
       * - reflections controladas
       *
       * No usamos emissive fuerte porque eso convierte
       * el cyan en una mancha blanca.
       */

      function createMaterial() {
        return new THREE.MeshPhysicalMaterial({
          /*
           * Cyan fuerte.
           */

          color: new THREE.Color(0x00c8cf),

          /*
           * No metal.
           *
           * Queremos aspecto de plástico/goma
           * inflada, no metal.
           */

          metalness: 0.0,

          /*
           * Muy brillante.
           */

          roughness: 0.12,

          /*
           * Capa transparente tipo barniz.
           */

          clearcoat: 0.95,

          clearcoatRoughness: 0.045,

          /*
           * Reflejo especular.
           */

          reflectivity: 0.5,

          /*
           * Pequeño sheen para que las curvas
           * tengan un aspecto más suave.
           */

          sheen: 0.05,

          sheenColor: new THREE.Color(0x5fffff),

          sheenRoughness: 0.12,

          /*
           * Mucho más controlado que antes.
           */

          envMapIntensity: 0.42,
        });
      }

      /*
       * ==================================================
       * ERROR
       * ==================================================
       */

      function showError(error) {
        console.error("Error:", error);

        loading.classList.add("hidden");

        errorBox.textContent =
          "No se pudo iniciar la demo.\n\n" +
          (error?.stack || error?.message || String(error));

        errorBox.style.display = "block";
      }

      /*
       * ==================================================
       * BOOT
       * ==================================================
       */

      async function boot() {
        try {
          await RAPIER.init();

          /*
           * ==================================================
           * SCENE
           * ==================================================
           */

          scene = new THREE.Scene();

          /*
           * ==================================================
           * CAMERA
           * ==================================================
           */

          camera = new THREE.PerspectiveCamera(
            34,
            innerWidth / innerHeight,
            0.1,
            100,
          );

          camera.position.set(0, 0.15, 9.2);

          camera.lookAt(0, 0, 0);

          /*
           * ==================================================
           * RENDERER
           * ==================================================
           *
           * IMPORTANTE:
           *
           * No usamos ACES Filmic.
           *
           * Eso permite que el cyan conserve mucha más
           * saturación.
           */
          renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true,
            powerPreference: "high-performance",
          });

          renderer.shadowMap.enabled = true;

          renderer.shadowMap.type = THREE.PCFSoftShadowMap;

          renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

          renderer.setSize(innerWidth, innerHeight);

          renderer.outputColorSpace = THREE.SRGBColorSpace;

          renderer.toneMapping = THREE.NoToneMapping;

          renderer.toneMappingExposure = 1.0;

          sceneRoot.appendChild(renderer.domElement);

          /*
           * ==================================================
           * ENVIRONMENT
           * ==================================================
           *
           * El environment nos da los reflejos glossy.
           *
           * La intensidad está bastante controlada para
           * evitar que el objeto quede blanco.
           */

          const pmrem = new THREE.PMREMGenerator(renderer);

          const environment = new RoomEnvironment();

          const envTexture = pmrem.fromScene(environment, 0.035).texture;

          scene.environmentIntensity = 0.32;

          scene.environment = envTexture;

          environment.dispose();

          pmrem.dispose();

          /*
           * ==================================================
           * LIGHTING
           * ==================================================
           */

          /*
           * Luz principal.
           *
           * Es la que genera la sombra.
           */

          const key = new THREE.DirectionalLight(0xffffff, 1.45);

          key.position.set(-4, 5, 6);

          key.castShadow = true;

          /*
           * Calidad de sombra.
           */

          key.shadow.mapSize.width = 2048;

          key.shadow.mapSize.height = 2048;

          key.shadow.camera.near = 0.1;

          key.shadow.camera.far = 20;

          key.shadow.camera.left = -6;

          key.shadow.camera.right = 6;

          key.shadow.camera.top = 5;

          key.shadow.camera.bottom = -5;

          key.shadow.bias = -0.0005;

          key.shadow.normalBias = 0.035;

          scene.add(key);

          /*
           * ==================================================
           * SOFT FILL
           * ==================================================
           *
           * Muy poca luz.
           *
           * Solo para que el lado oscuro no quede negro.
           */

          const fill = new THREE.DirectionalLight(0x78ffff, 0.22);

          fill.position.set(4, 1, 3);

          scene.add(fill);

          /*
           * ==================================================
           * TOP / RIM
           * ==================================================
           *
           * Un pequeño highlight arriba.
           */

          const rim = new THREE.PointLight(0xffffff, 2.0, 12, 2);

          rim.position.set(0, 4, 5);

          scene.add(rim);

          /*
           * ==================================================
           * PHYSICS
           * ==================================================
           */

          world = new RAPIER.World({
            x: 0,
            y: 0,
            z: 0,
          });

          setupBoundaryWalls();

          /*
           * ==================================================
           * FONT
           * ==================================================
           */

          const font = await new FontLoader().loadAsync(FONT_URL);

          /*
           * ==================================================
           * LETTER SPECS
           * ==================================================
           */

          const specs = [
            {
              text: "B",

              /*
               * Más cerca del centro.
               */

              x: -0.82,

              y: 0.05,

              z: 0,

              rot: -0.06,

              scale: 0.6,
            },

            {
              text: "&",

              x: 0,

              y: -0.02,

              z: 0.03,

              rot: 0.04,

              scale: 0.5,
            },

            {
              text: "R",

              x: 0.82,

              y: 0.02,

              z: 0,

              rot: 0.07,

              scale: 0.6,
            },
          ];

          for (const spec of specs) {
            createLetter(font, spec);
          }

          /*
           * ==================================================
           * EVENTS
           * ==================================================
           */

          setupPointerEvents();

          addEventListener("resize", onResize);

          loading.classList.add("hidden");

          animate();
        } catch (error) {
          showError(error);
        }
      }

      /*
       * ==================================================
       * CREATE LETTER
       * ==================================================
       */

      function createLetter(font, spec) {
        /*
         * ==================================================
         * TEXT GEOMETRY
         * ==================================================
         */

        const textGeo = new TextGeometry(spec.text, {
          font,

          size: spec.scale,

          depth: 0.2,

          curveSegments: 28,

          bevelEnabled: true,

          bevelThickness: 0.095,

          bevelSize: 0.065,

          bevelOffset: 0,

          bevelSegments: 16,
        });

        textGeo.center();

        const geometry = mergeVertices(textGeo, 1e-4);

        geometry.computeVertexNormals();

        geometry.computeBoundingBox();

        /*
         * ==================================================
         * MESH
         * ==================================================
         */

        const mesh = new THREE.Mesh(geometry, createMaterial());

        mesh.position.set(spec.x, spec.y, spec.z);

        mesh.rotation.z = spec.rot;

        mesh.castShadow = true;
        mesh.receiveShadow = true;

        scene.add(mesh);

        /*
         * ==================================================
         * BOUNDS
         * ==================================================
         */

        const box = geometry.boundingBox;

        const hx = Math.max((box.max.x - box.min.x) / 2, 0.05);

        const hy = Math.max((box.max.y - box.min.y) / 2, 0.05);

        const hz = Math.max((box.max.z - box.min.z) / 2, 0.05);

        /*
         * ==================================================
         * INITIAL ROTATION
         * ==================================================
         */

        const initialQuaternion = new THREE.Quaternion().setFromEuler(
          new THREE.Euler(0, 0, spec.rot),
        );

        /*
         * ==================================================
         * RIGID BODY
         * ==================================================
         *
         * Permitimos rotación en Z.
         *
         * Esto es importante:
         *
         * las letras pueden girar cuando chocan.
         */

        const bodyDesc = RAPIER.RigidBodyDesc.dynamic()

          .setTranslation(spec.x, spec.y, spec.z)

          .setRotation({
            x: initialQuaternion.x,

            y: initialQuaternion.y,

            z: initialQuaternion.z,

            w: initialQuaternion.w,
          })

          .setLinearDamping(1.0)

          /*
           * Este damping evita que una colisión
           * produzca un giro infinito.
           */

          .setAngularDamping(2.2)

          .setCcdEnabled(true)

          /*
           * X/Y libres.
           * Z bloqueado porque queremos mantener
           * todo dentro del plano visual.
           */

          .enabledTranslations(true, true, false)

          /*
           * X/Y bloqueados.
           * Z libre.
           */

          .enabledRotations(false, false, true);

        const body = world.createRigidBody(bodyDesc);

        /*
         * ==================================================
         * COLLIDER
         * ==================================================
         *
         * Un poco más blando que antes.
         *
         * Menos restitution =
         * menos rebote violento.
         */

        const colliderDesc = RAPIER.ColliderDesc.roundCuboid(hx, hy, hz, 0.085)

          .setDensity(0.28)

          .setRestitution(0.32)

          .setFriction(0.22);

        world.createCollider(colliderDesc, body);

        /*
         * ==================================================
         * ITEM
         * ==================================================
         */

        const item = {
          mesh,

          body,

          isDragging: false,

          returning: false,

          homePosition: new THREE.Vector3(spec.x, spec.y, spec.z),

          homeQuaternion: initialQuaternion.clone(),

          previousDragPoint: new THREE.Vector3(),

          dragVelocity: new THREE.Vector3(),
        };

        mesh.userData.letter = item;

        letters.push(item);
      }

      /*
       * ==================================================
       * VIEWPORT BOUNDS
       * ==================================================
       */

      function getViewportBounds() {
        const distance = camera.position.z;

        const vFov = THREE.MathUtils.degToRad(camera.fov);

        const height = 2 * Math.tan(vFov / 2) * distance;

        const width = height * camera.aspect;

        return {
          left: -width / 2,

          right: width / 2,

          bottom: -height / 2,

          top: height / 2,
        };
      }

      /*
       * ==================================================
       * BOUNDARY WALLS
       * ==================================================
       */

      function setupBoundaryWalls() {
        const bounds = getViewportBounds();

        const thickness = 0.5;

        const walls = [
          {
            id: "left",

            x: bounds.left - thickness / 2,

            y: 0,

            hx: thickness / 2,

            hy: Math.abs(bounds.top - bounds.bottom) / 2 + thickness,
          },

          {
            id: "right",

            x: bounds.right + thickness / 2,

            y: 0,

            hx: thickness / 2,

            hy: Math.abs(bounds.top - bounds.bottom) / 2 + thickness,
          },

          {
            id: "top",

            x: 0,

            y: bounds.top + thickness / 2,

            hx: Math.abs(bounds.right - bounds.left) / 2 + thickness,

            hy: thickness / 2,
          },

          {
            id: "bottom",

            x: 0,

            y: bounds.bottom - thickness / 2,

            hx: Math.abs(bounds.right - bounds.left) / 2 + thickness,

            hy: thickness / 2,
          },
        ];

        for (const wall of walls) {
          const body = world.createRigidBody(
            RAPIER.RigidBodyDesc.fixed().setTranslation(wall.x, wall.y, 0),
          );

          const collider = RAPIER.ColliderDesc.cuboid(wall.hx, wall.hy, 10)

            /*
             * Menos rebote.
             */

            .setRestitution(0.38)

            .setFriction(0.24);

          world.createCollider(collider, body);

          wallBodies[wall.id] = body;
        }
      }

      function updateBoundaryWalls() {
        if (!wallBodies.left) {
          return;
        }

        const bounds = getViewportBounds();

        const thickness = 0.5;

        wallBodies.left.setTranslation(
          {
            x: bounds.left - thickness / 2,

            y: 0,

            z: 0,
          },
          true,
        );

        wallBodies.right.setTranslation(
          {
            x: bounds.right + thickness / 2,

            y: 0,

            z: 0,
          },
          true,
        );

        wallBodies.top.setTranslation(
          {
            x: 0,

            y: bounds.top + thickness / 2,

            z: 0,
          },
          true,
        );

        wallBodies.bottom.setTranslation(
          {
            x: 0,

            y: bounds.bottom - thickness / 2,

            z: 0,
          },
          true,
        );
      }

      /*
       * ==================================================
       * POINTER
       * ==================================================
       */

      function setupPointerEvents() {
        const canvas = renderer.domElement;

        canvas.addEventListener("pointerdown", onPointerDown);

        canvas.addEventListener("pointermove", onPointerMove);

        canvas.addEventListener("pointerup", onPointerUp);

        canvas.addEventListener("pointercancel", onPointerUp);

        canvas.addEventListener("dblclick", onDoubleClick);

        document.querySelector("#resetButton").addEventListener("click", () => {
          window.location.reload();
        });
      }

      function updatePointer(event) {
        const rect = renderer.domElement.getBoundingClientRect();

        pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;

        pointer.y = -(((event.clientY - rect.top) / rect.height) * 2 - 1);
      }

      function pickLetter(event) {
        updatePointer(event);

        raycaster.setFromCamera(pointer, camera);

        const hits = raycaster.intersectObjects(
          letters.map((item) => item.mesh),
          false,
        );

        if (!hits.length) {
          return null;
        }

        return hits[0].object.userData.letter ?? null;
      }

      /*
       * ==================================================
       * POINTER DOWN
       * ==================================================
       */

      function onPointerDown(event) {
        const item = pickLetter(event);

        if (!item) {
          return;
        }

        dragged = item;

        item.isDragging = true;

        item.returning = false;

        dragPlane.constant = -item.mesh.position.z;

        raycaster.ray.intersectPlane(dragPlane, dragPoint);

        dragOffset.copy(item.mesh.position).sub(dragPoint);

        item.previousDragPoint.copy(dragPoint);

        /*
         * Paramos movimiento mientras empieza
         * el drag.
         */

        item.body.setLinvel(
          {
            x: 0,
            y: 0,
            z: 0,
          },
          true,
        );

        item.body.setAngvel(
          {
            x: 0,
            y: 0,
            z: 0,
          },
          true,
        );

        renderer.domElement.classList.add("dragging");

        renderer.domElement.setPointerCapture?.(event.pointerId);
      }

      /*
       * ==================================================
       * POINTER MOVE
       * ==================================================
       */

      function onPointerMove(event) {
        if (!dragged) {
          return;
        }

        updatePointer(event);

        raycaster.setFromCamera(pointer, camera);

        if (!raycaster.ray.intersectPlane(dragPlane, dragPoint)) {
          return;
        }

        const next = dragPoint.clone().add(dragOffset);

        next.z = 0;

        const current = dragged.body.translation();

        /*
         * Velocidad de seguimiento.
         */

        const vx = (next.x - current.x) * 22;

        const vy = (next.y - current.y) * 22;

        dragged.body.setLinvel(
          {
            x: vx,
            y: vy,
            z: 0,
          },
          true,
        );

        /*
         * No queremos que el drag genere
         * rotación artificial.
         */

        dragged.body.setAngvel(
          {
            x: 0,
            y: 0,
            z: 0,
          },
          true,
        );

        dragged.previousDragPoint.copy(next);
      }

      /*
       * ==================================================
       * POINTER UP
       * ==================================================
       */

      function onPointerUp(event) {
        if (!dragged) {
          return;
        }

        const item = dragged;

        item.isDragging = false;

        /*
         * No soltamos la letra con velocidad.
         *
         * Esto hace que el comportamiento sea:
         *
         * agarrar → mover → soltar → volver
         */

        item.body.setLinvel(
          {
            x: 0,
            y: 0,
            z: 0,
          },
          true,
        );

        item.returning = true;

        dragged = null;

        renderer.domElement.releasePointerCapture?.(event.pointerId);

        renderer.domElement.classList.remove("dragging");
      }

      /*
       * ==================================================
       * DOUBLE CLICK
       * ==================================================
       */

      function onDoubleClick(event) {
        const item = pickLetter(event);

        if (!item) {
          return;
        }

        /*
         * No reseteamos la rotación
         * inmediatamente.
         *
         * Dejamos que la física resuelva
         * la orientación.
         */

        item.body.setAngvel(
          {
            x: 0,
            y: 0,
            z: 0,
          },
          true,
        );

        item.returning = true;
      }

      /*
       * ==================================================
       * RETURN SPRING
       * ==================================================
       *
       * ESTE ES EL CAMBIO MÁS IMPORTANTE.
       *
       * Antes hacíamos:
       *
       *   setRotation(...)
       *
       * cada frame.
       *
       * Eso competía contra el solver de Rapier
       * durante las colisiones y producía el
       * efecto de "temblor / romperse".
       *
       * Ahora:
       *
       * - posición → spring velocity
       * - rotación → angular velocity
       *
       * Rapier mantiene el control físico.
       */

      function updateReturningLetters(delta) {
        /*
         * ==================================================
         * POSITION SPRING
         * ==================================================
         */

        const SPRING = 8.5;

        const RETURN_DAMPING = 2.8;

        const MAX_RETURN_SPEED = 3.2;

        /*
         * ==================================================
         * ROTATION SPRING
         * ==================================================
         */

        const ROTATION_SPRING = 3.5;

        const ROTATION_DAMPING = 2.4;

        const MAX_ANGULAR_SPEED = 5.0;

        for (const item of letters) {
          if (item.isDragging) {
            continue;
          }

          /*
           * ==================================================
           * POSITION
           * ==================================================
           */

          const current = item.body.translation();

          const dx = item.homePosition.x - current.x;

          const dy = item.homePosition.y - current.y;

          const distance = Math.sqrt(dx * dx + dy * dy);

          /*
           * Velocidad actual.
           */

          const velocity = item.body.linvel();

          /*
           * Fuerza tipo spring:
           *
           * F = kx - cv
           *
           * No teletransportamos.
           *
           * La física sigue teniendo control.
           */

          let vx =
            velocity.x + (dx * SPRING - velocity.x * RETURN_DAMPING) * delta;

          let vy =
            velocity.y + (dy * SPRING - velocity.y * RETURN_DAMPING) * delta;

          /*
           * Limitar velocidad.
           */

          const speed = Math.sqrt(vx * vx + vy * vy);

          if (speed > MAX_RETURN_SPEED) {
            const scale = MAX_RETURN_SPEED / speed;

            vx *= scale;
            vy *= scale;
          }

          item.body.setLinvel(
            {
              x: vx,
              y: vy,
              z: 0,
            },
            true,
          );

          /*
           * ==================================================
           * ROTATION
           * ==================================================
           *
           * Dejamos que la letra gire libremente.
           *
           * Si se golpea:
           *
           *     puede rotar.
           *
           * Si se da vuelta:
           *
           *     puede seguir rotada.
           *
           * Después vuelve suavemente.
           */

          const rotation = item.body.rotation();

          const currentQuaternion = new THREE.Quaternion(
            rotation.x,
            rotation.y,
            rotation.z,
            rotation.w,
          );

          /*
           * Extraemos el ángulo Z actual.
           */

          const euler = new THREE.Euler().setFromQuaternion(
            currentQuaternion,
            "XYZ",
          );

          const currentAngle = euler.z;

          const homeEuler = new THREE.Euler().setFromQuaternion(
            item.homeQuaternion,
            "XYZ",
          );

          const homeAngle = homeEuler.z;

          /*
           * Diferencia angular normalizada
           * a [-PI, PI].
           */

          let angleDifference = homeAngle - currentAngle;

          while (angleDifference > Math.PI) {
            angleDifference -= Math.PI * 2;
          }

          while (angleDifference < -Math.PI) {
            angleDifference += Math.PI * 2;
          }

          /*
           * Velocidad angular actual.
           */

          const angularVelocity = item.body.angvel();

          /*
           * Resorte angular.
           */

          let angularZ =
            angularVelocity.z +
            (angleDifference * ROTATION_SPRING -
              angularVelocity.z * ROTATION_DAMPING) *
              delta;

          /*
           * Limitamos solamente el giro
           * producido por el retorno.
           */

          angularZ = THREE.MathUtils.clamp(
            angularZ,
            -MAX_ANGULAR_SPEED,
            MAX_ANGULAR_SPEED,
          );

          /*
           * IMPORTANTE:
           *
           * No hacemos setRotation().
           *
           * Dejamos que Rapier integre la rotación.
           */

          item.body.setAngvel(
            {
              x: 0,
              y: 0,
              z: angularZ,
            },
            true,
          );

          /*
           * ==================================================
           * ARRIVAL
           * ==================================================
           */

          if (
            distance < 0.012 &&
            Math.abs(angleDifference) < 0.01 &&
            Math.abs(vx) < 0.08 &&
            Math.abs(vy) < 0.08 &&
            Math.abs(angularZ) < 0.08
          ) {
            /*
             * Solo aquí corregimos la posición.
             *
             * Como ya estamos prácticamente en casa,
             * no hay una pelea con el solver.
             */

            item.body.setTranslation(
              {
                x: item.homePosition.x,

                y: item.homePosition.y,

                z: item.homePosition.z,
              },
              true,
            );

            item.body.setLinvel(
              {
                x: 0,
                y: 0,
                z: 0,
              },
              true,
            );

            item.body.setAngvel(
              {
                x: 0,
                y: 0,
                z: 0,
              },
              true,
            );

            item.returning = false;
          }
        }
      }

      /*
       * ==================================================
       * PHYSICS → THREE
       * ==================================================
       */

      function syncPhysics() {
        for (const item of letters) {
          const translation = item.body.translation();

          const rotation = item.body.rotation();

          item.mesh.position.set(translation.x, translation.y, translation.z);

          item.mesh.quaternion.set(
            rotation.x,
            rotation.y,
            rotation.z,
            rotation.w,
          );
        }
      }

      /*
       * ==================================================
       * ANIMATION LOOP
       * ==================================================
       */

      function animate() {
        requestAnimationFrame(animate);

        timer.update();

        const delta = Math.min(timer.getDelta(), 0.033);

        /*
         * Primero aplicamos el resorte.
         */

        updateReturningLetters(delta);

        /*
         * Después Rapier resuelve:
         *
         * - colisiones
         * - rotaciones
         * - paredes
         * - cuerpos
         */

        world.timestep = delta;

        world.step();

        /*
         * Finalmente copiamos el resultado
         * a Three.js.
         */

        syncPhysics();

        renderer.render(scene, camera);
      }

      /*
       * ==================================================
       * RESIZE
       * ==================================================
       */

      function onResize() {
        camera.aspect = innerWidth / innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(innerWidth, innerHeight);

        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

        updateBoundaryWalls();
      }

      /*
       * ==================================================
       * START
       * ==================================================
       */

      boot();
    </script>
  </body>
</html>
